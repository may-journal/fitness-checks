# Builds and tests only the checks that scripts/changed-checks.sh says a
# change can alter, so one check's edit never waits on the others.
name: Checks
on:
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - requirements/**
      - docs/requirements/**
      - tests/**
      - go.mod
      - go.sum
      - scripts/**
      - .github/workflows/checks.yml
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/**
      - requirements/**
      - docs/requirements/**
      - tests/**
      - go.mod
      - go.sum
      - scripts/**
      - .github/workflows/checks.yml

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.pick.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pick the changed checks
        id: pick
        env:
          # A pull request checks out its merge into the base. That merge's
          # first parent is the base as it stands, so the diff is the PR's.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: scripts/step-output.sh checks scripts/changed-checks.sh "$BASE"
      - name: Report job outcome
        if: ${{ always() }}
        env:
          CHECKS: ${{ steps.pick.outputs.checks }}
        run: printf '### Job %s (%s)\n\n%s\n' "$GITHUB_JOB" "${{ job.status }}" "$CHECKS" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: changed
    if: ${{ needs.changed.outputs.checks != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.changed.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build, vet and test the check
        env:
          CHECK: ${{ matrix.check }}
        run: scripts/test-check.sh "$CHECK"
      - name: Report job outcome
        if: ${{ always() }}
        env:
          CHECK: ${{ matrix.check }}
        run: printf '### %s (%s)\n' "$CHECK" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  requirements:
    # Eight jobs share the root requirements package, balanced by the times
    # in tests/requirement-times.tsv, so a pull request waits on an eighth of
    # it. The suite step fails once it passes two minutes.
    name: requirements ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A key of its own keeps the build cache these jobs fill, every check
          # included, apart from the small one the other jobs save first.
          cache-dependency-path: |
            go.sum
            tests/requirements.sh
      - name: Run the requirement suite against these programs
        timeout-minutes: 2
        env:
          REQUIREMENT_SHARD: ${{ matrix.shard }}
        # The measure script builds every check three times, so main runs it
        # in the measure job instead of every pull request waiting on it. The
        # -v log gives each test's time for scripts/requirement-times.sh.
        run: tests/requirements.sh -v -skip '^Test0001_7$/^measure_script'
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n' "$GITHUB_JOB ${{ matrix.shard }}" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  check-requirements:
    # A pull request runs the requirement folders of the checks it changes,
    # and main runs every check's folder.
    needs: changed
    if: ${{ github.event_name != 'pull_request' || needs.changed.outputs.checks != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/requirements.sh
      - name: Run the changed checks' requirement folders
        timeout-minutes: 2
        env:
          REQUIREMENT_SHARD: checks
          REQUIREMENT_CHECKS: ${{ github.event_name == 'pull_request' && needs.changed.outputs.checks || '' }}
        run: tests/requirements.sh
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n' "$GITHUB_JOB" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  measure:
    # The measure script builds every check three times, so it runs on main
    # only, after each merge.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/requirements.sh
      - name: Run the measure script's requirement test
        # One share of one keeps the run to the root package, and the later
        # -run narrows it to the measure case.
        env:
          REQUIREMENT_SHARD: 1/1
        run: tests/requirements.sh -run '^Test0001_7$/^measure_script'
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n' "$GITHUB_JOB" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
