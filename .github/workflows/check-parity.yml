# Runs each check as its binary and as the engine's built-in on fixed samples, and fails on a different verdict.
# The results table stays with the run as an artifact and in its summary.
name: Check parity
on:
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - tests/parity/**
      - scripts/check-parity.sh
      - .github/workflows/check-parity.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare binaries with built-ins
        run: scripts/check-parity.sh out/parity
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: |
            out/parity/results.tsv
            out/parity/results
      - name: Report job outcome
        if: ${{ always() }}
        run: scripts/check-parity-summary.sh out/parity/results.tsv "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
